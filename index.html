<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixIt3D - Global Repair Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deepSlate: '#0F172A',
                        skyBlue: '#38BDF8',
                        darkClay: '#2A1810',
                        orangeAccent: '#F97316',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="repair-mode text-slate-100 min-h-screen">

    <!-- HEADER -->
    <header class="glass fixed top-0 w-full h-16 z-50 flex items-center justify-between px-6 border-b border-white/10">
        <div class="flex items-center gap-4">
            <a href="#/" class="text-2xl font-black tracking-tighter text-skyBlue">FIXIT<span class="text-white">3D</span></a>
        </div>

        <div class="flex-1 max-w-2xl mx-8 relative">
            <div class="relative group">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="omni-search"
                    class="w-full bg-white/5 border border-white/10 rounded-full py-2 pl-12 pr-12 focus:outline-none focus:ring-2 focus:ring-skyBlue/50 transition-all"
                    placeholder="Поиск по бренду, устройству или коду детали...">
                <button id="search-photo-btn" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
                    <i class="fas fa-camera"></i>
                </button>
            </div>
            <!-- Search Results Dropdown -->
            <div id="search-results" class="hidden absolute top-full left-0 w-full mt-2 glass rounded-2xl border border-white/10 overflow-hidden shadow-2xl z-50">
                <!-- Populated by JS -->
            </div>
        </div>

        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3 text-sm font-bold bg-white/5 p-1 rounded-full border border-white/10">
                <button id="repair-mode-btn" class="px-4 py-1.5 rounded-full transition-all bg-skyBlue text-white">REPAIR 🛠️</button>
                <button id="hobby-mode-btn" class="px-4 py-1.5 rounded-full transition-all text-slate-400">HOBBY 🎨</button>
            </div>
            <div class="flex items-center gap-2">
                <div id="user-badge" class="hidden px-3 py-1 bg-green-500/20 text-green-400 text-xs font-bold rounded-full border border-green-500/30 uppercase tracking-wider">Maker</div>
                <div class="w-10 h-10 rounded-full bg-skyBlue/20 border border-skyBlue/50 flex items-center justify-center">
                    <i class="fas fa-user text-skyBlue"></i>
                </div>
            </div>
        </div>
    </header>

    <div class="flex pt-16 h-screen overflow-hidden">
        <!-- LEFT SIDEBAR -->
        <aside class="w-64 border-r border-white/10 bg-black/20 flex flex-col hidden lg:flex">
            <div class="p-6 overflow-y-auto flex-1">
                <div class="mb-8">
                    <h3 class="text-xs font-black uppercase tracking-widest text-slate-500 mb-4">Навигация</h3>
                    <ul class="space-y-1" id="sidebar-main-nav">
                        <li>
                            <a href="#/" class="flex items-center gap-3 px-3 py-2 rounded-xl bg-white/5 text-skyBlue font-bold">
                                <i class="fas fa-th-large w-5"></i> Обзор
                            </a>
                        </li>
                        <li>
                            <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-xl text-slate-400 hover:bg-white/5 hover:text-white transition-all">
                                <i class="fas fa-box w-5"></i> Все детали
                            </a>
                        </li>
                    </ul>
                </div>

                <div class="mb-8">
                    <h3 class="text-xs font-black uppercase tracking-widest text-slate-500 mb-4" id="sidebar-context-title">Комнаты</h3>
                    <ul class="space-y-1" id="dynamic-sidebar-list">
                        <!-- Populated by JS -->
                    </ul>
                </div>

                <div class="mb-8">
                    <h3 class="text-xs font-black uppercase tracking-widest text-slate-500 mb-4">Популярные Бренды</h3>
                    <div class="grid grid-cols-2 gap-2" id="sidebar-brands">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main id="main-content" class="flex-1 overflow-y-auto p-8 custom-scrollbar">
            <!-- Breadcrumbs -->
            <nav id="breadcrumbs" class="flex items-center gap-2 text-sm text-slate-500 mb-6">
                <!-- Populated by JS -->
            </nav>

            <!-- Dynamic View Container -->
            <div id="view-container">
                <!-- Skeleton Loader Example -->
                <div class="skeleton-pulse space-y-8">
                    <div class="h-12 w-1/3 bg-white/5 rounded-xl"></div>
                    <div class="grid grid-cols-4 gap-6">
                        <div class="h-40 bg-white/5 rounded-2xl"></div>
                        <div class="h-40 bg-white/5 rounded-2xl"></div>
                        <div class="h-40 bg-white/5 rounded-2xl"></div>
                        <div class="h-40 bg-white/5 rounded-2xl"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- RIGHT SIDEBAR -->
        <aside class="w-80 border-l border-white/10 bg-black/20 flex flex-col hidden xl:flex">
            <div class="p-6 overflow-y-auto flex-1">
                <div class="mb-8">
                    <h3 class="text-xs font-black uppercase tracking-widest text-slate-500 mb-4">Мой гараж</h3>
                    <div id="garage-list" class="space-y-3">
                        <div class="p-4 rounded-2xl border-2 border-dashed border-white/5 flex flex-col items-center justify-center text-center gap-2 text-slate-500 hover:border-skyBlue/30 hover:text-slate-300 transition-all cursor-pointer">
                            <i class="fas fa-plus-circle text-2xl"></i>
                            <span class="text-xs font-bold">Добавить устройство</span>
                        </div>
                    </div>
                </div>

                <div>
                    <h3 class="text-xs font-black uppercase tracking-widest text-slate-500 mb-4">История</h3>
                    <ul id="history-list" class="space-y-4">
                        <!-- Populated by JS -->
                    </ul>
                </div>
            </div>
        </aside>
    </div>

    <!-- MOBILE TAB BAR -->
    <nav class="lg:hidden fixed bottom-0 w-full h-16 glass border-t border-white/10 flex items-center justify-around z-50">
        <a href="#/" class="flex flex-col items-center gap-1 text-skyBlue">
            <i class="fas fa-home text-xl"></i>
            <span class="text-[10px] font-bold uppercase">Home</span>
        </a>
        <button class="flex flex-col items-center gap-1 text-slate-400">
            <i class="fas fa-search text-xl"></i>
            <span class="text-[10px] font-bold uppercase">Search</span>
        </button>
        <button class="w-12 h-12 -mt-8 bg-skyBlue rounded-2xl flex items-center justify-center shadow-lg shadow-skyBlue/30 text-white">
            <i class="fas fa-camera text-xl"></i>
        </button>
        <button class="flex flex-col items-center gap-1 text-slate-400">
            <i class="fas fa-heart text-xl"></i>
            <span class="text-[10px] font-bold uppercase">Saved</span>
        </a>
        <button class="flex flex-col items-center gap-1 text-slate-400">
            <i class="fas fa-user text-xl"></i>
            <span class="text-[10px] font-bold uppercase">Profile</span>
        </a>
    </nav>

    <!-- Modal for "Request a Part" -->
    <div id="request-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/80 backdrop-blur-sm">
        <div class="glass w-full max-w-lg p-8 rounded-3xl border border-white/10 shadow-2xl scale-95 opacity-0 transition-all duration-300">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black">Заказать деталь</h2>
                <button id="close-modal" class="text-slate-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <p class="text-slate-400 mb-6">Не нашли нужную модель? Оставьте заявку, и наши специалисты или сообщество помогут её создать.</p>
            <form class="space-y-4">
                <input type="text" placeholder="Модель устройства" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 px-4 focus:outline-none focus:ring-2 focus:ring-skyBlue/50">
                <textarea placeholder="Описание детали" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 px-4 h-32 focus:outline-none focus:ring-2 focus:ring-skyBlue/50"></textarea>
                <button type="button" class="w-full py-4 bg-skyBlue text-white font-black rounded-xl shadow-lg shadow-skyBlue/20 hover:scale-[1.02] active:scale-[0.98] transition-all">Отправить заявку</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP SCRIPT -->
    <script type="module" src="scripts/app.js"></script>
</body>
</html>
